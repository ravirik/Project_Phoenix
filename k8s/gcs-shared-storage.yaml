apiVersion: v1
kind: PersistentVolume
metadata:
  name: gcs-fuse-shared-pv
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 10Gi  # GCS has no size limit, but a value is required by K8s
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" # Must be empty for GCSFuse
  claimRef:
    namespace: default
    name: gcs-fuse-shared-pvc
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: phoenix-ml-data-bucket  # Your unique bucket name
    volumeAttributes:
      bucketName: phoenix-ml-data-bucket
      mountOptions: "implicit-dirs"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gcs-fuse-shared-pvc
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
  volumeName: gcs-fuse-shared-pv